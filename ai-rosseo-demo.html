<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="AI가 변호사를 추천할 때 법률신문을 출처로 인용하게 하는 GEO 기반 법조인 검색 플랫폼 (샘플 데모)">
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;min-height:100%}</style>
<title>AI로써 · 법률신문 — 법조인 GEO 플랫폼</title>
<meta name="description" content="AI가 변호사를 추천할 때, 법률신문을 출처로 인용하게 하는 GEO 기반 법조인 검색 플랫폼 (샘플 데모)">
<style>
/* ═══════════════ A. RESET + BASE ═══════════════ */
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:var(--sans);color:var(--t1);
  background:radial-gradient(1100px 520px at 50% -120px,var(--surface),transparent 70%),var(--paper);
  font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;overflow-x:hidden;
  word-break:keep-all;overflow-wrap:break-word}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
img{max-width:100%}
::selection{background:var(--gold-soft);color:var(--navy)}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:3px}

/* ═══════════════ B. DESIGN TOKENS ═══════════════ */
:root{
  /* LIGHT — warm ivory + legal navy + brass seal */
  --paper:#f5f2ec; --surface:#ffffff; --surface2:#efe9de; --surface3:#e7dfd0;
  --border:#e2d9c8; --line:#ece5d7; --hair:rgba(27,42,74,.08);
  --navy:#1b2a4a; --navy2:#2c3e64; --navy-soft:#e7ecf4;
  --gold:#b0842a; --gold2:#8f6a1f; --gold-soft:#f2e7cc;
  --seal:#b23a2e; --seal-soft:#f5e2de;
  --t1:#1b1d22; --t2:#5d5850; --t3:#8f887b; --t-inv:#f5f2ec;
  /* category tints */
  --c-blue:#2f5f9e; --c-blue-bg:#e6eef7;
  --c-green:#2f7d52; --c-green-bg:#e4f1e9;
  --c-purple:#6a4a92; --c-purple-bg:#ede7f5;
  --c-orange:#b5741d; --c-orange-bg:#f8ecd6;
  --c-gray:#6a6459;  --c-gray-bg:#ece6da;
  /* verdict / status */
  --ok:#2f7d52; --ok-bg:#e4f1e9; --warn:#b5741d; --warn-bg:#f8ecd6;
  --bad:#b23a2e; --bad-bg:#f5e2de;
  /* 신호색 — 라이트 모드용(레이더 화이트톤). 다크에서 .theme-dark가 재정의 */
  --amber:#b0842a; --amber2:#8f6a1f; --cyan:#2f5f9e; --green:#2f7d52; --red:#b23a2e; --violet:#6a4a92;
  --radius:8px; --radius-sm:5px; --radius-lg:14px;
  --shadow-sm:0 1px 2px rgba(27,25,10,.05);
  --shadow:0 1px 3px rgba(27,25,10,.06),0 8px 24px rgba(27,25,10,.06);
  --shadow-lg:0 4px 12px rgba(27,25,10,.09),0 24px 60px rgba(27,25,10,.11);
  --serif:Georgia,'Times New Roman','Apple Myungjo','AppleMyungjo','Nanum Myeongjo','Batang',serif;
  --sans:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  --mono:'SF Mono',ui-monospace,'JetBrains Mono',Menlo,Consolas,monospace;
  --maxw:1120px;
  --ease-out:cubic-bezier(.2,.6,.2,1);
  --ease-spring:cubic-bezier(.34,1.35,.4,1);
  --dur-fast:.14s; --dur-med:.22s;
  --label-fs:10.5px; --track-label:.07em;
}
/* DARK terminal — applied via .theme-dark wrapper (radar inset + admin) */
.theme-dark{
  --paper:#0A0E1A; --surface:#141929; --surface2:#1E2640; --surface3:#2A3454;
  --border:#242c46; --line:#1c2338; --hair:rgba(255,255,255,.08);
  --navy:#0A0E1A; --navy2:#141929; --navy-soft:#1E2640;
  --gold:#F5A623; --gold2:#FFCA6B; --gold-soft:#2a2410;
  --seal:#FF5A5A; --seal-soft:#2a1518;
  --t1:#F0EDE8; --t2:#9BA3B8; --t3:#5a6484; --t-inv:#0A0E1A;
  --c-blue:#4DC8E8; --c-blue-bg:#12283a;
  --c-green:#3DD68C; --c-green-bg:#0f2a20;
  --c-purple:#A78BFA; --c-purple-bg:#1e1836;
  --c-orange:#F5A623; --c-orange-bg:#2a2410;
  --c-gray:#9BA3B8;  --c-gray-bg:#1a2138;
  --ok:#3DD68C; --ok-bg:#0f2a20; --warn:#F5A623; --warn-bg:#2a2410;
  --bad:#FF5A5A; --bad-bg:#2a1518;
  --amber:#F5A623; --amber2:#FFCA6B; --cyan:#4DC8E8; --green:#3DD68C; --red:#FF5A5A;
  --shadow-sm:0 1px 2px rgba(0,0,0,.4);
  --shadow:0 2px 8px rgba(0,0,0,.4),0 12px 40px rgba(0,0,0,.35);
  --shadow-lg:0 4px 16px rgba(0,0,0,.5),0 30px 70px rgba(0,0,0,.45);
}
/* 다크 표면의 고도 = 상단 1px 하이라이트(입사광) + 깊은 암부 그림자 */
.theme-dark .card,.theme-dark .pnode,.theme-dark .tile,.theme-dark .rcard,
.theme-dark .ticker,.theme-dark .hitl-step,.theme-dark .verdict{
  box-shadow:inset 0 1px 0 rgba(255,255,255,.05),
             0 1px 2px rgba(0,0,0,.5),0 10px 28px rgba(0,0,0,.3)}

/* ═══════════════ C. LAYOUT PRIMITIVES ═══════════════ */
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 24px}
.stack{display:flex;flex-direction:column}
.row{display:flex;align-items:center}
.grid{display:grid;gap:16px}
.card{background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius-lg);box-shadow:var(--shadow-sm)}
.tnum{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono)}
.serif{font-family:var(--serif)}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;
  color:var(--gold2)}
.muted{color:var(--t2)}
.dim{color:var(--t3)}

/* ═══════════════ D. SHARED CHROME ═══════════════ */
/* 마스트헤드 — 브로드시트 이중 괘선(thick-thin Oxford rule) */
#app-header{position:sticky;top:0;z-index:60;background:rgba(245,242,236,.88);
  backdrop-filter:saturate(1.6) blur(12px);
  border-bottom:2px solid var(--navy)}
#app-header::after{content:"";position:absolute;left:0;right:0;bottom:3px;height:1px;
  background:color-mix(in srgb,var(--navy) 40%,transparent)}
.hd{max-width:var(--maxw);margin:0 auto;padding:0 24px;height:62px;
  display:flex;align-items:center;gap:28px}
.brand{display:flex;align-items:baseline;gap:9px;font-weight:800}
.brand .logo{font-family:var(--serif);font-size:22px;color:var(--navy);letter-spacing:-.01em}
.brand .logo b{color:var(--gold2)}
.brand .by{font-size:10.5px;color:var(--t3);font-weight:700;letter-spacing:.04em;
  border-left:1px solid var(--border);padding-left:9px;position:relative;top:-1px}
.nav{display:flex;gap:2px;margin-left:6px}
.nav a{padding:8px 13px;border-radius:var(--radius-sm);font-size:13.5px;font-weight:600;
  color:var(--t2);transition:background var(--dur-fast) var(--ease-out),color var(--dur-fast) var(--ease-out)}
.nav a:hover{background:var(--surface2);color:var(--t1)}
.nav a[aria-current="page"]{color:var(--navy);background:var(--navy-soft)}
.hd-sp{flex:1}
.hd-admin{display:flex;align-items:center;gap:7px;padding:7px 13px;border-radius:99px;
  font-size:12.5px;font-weight:700;color:var(--gold2);background:var(--gold-soft);
  border:1px solid var(--border);
  transition:transform var(--dur-fast) var(--ease-spring),box-shadow var(--dur-fast) var(--ease-out)}
.hd-admin:hover{box-shadow:var(--shadow-sm);transform:translateY(-1px)}
.hd-admin .dot{width:6px;height:6px;border-radius:99px;background:var(--gold);
  box-shadow:0 0 0 0 var(--gold);animation:ld 2.4s infinite}
/* 페이지 진입 — 섹션·카드 캐스케이드 (한 덩어리 페이드 금지) */
#view{min-height:70vh}
#view section.wrap{animation:fadeUp .5s var(--ease-out) backwards}
#view section.wrap:nth-of-type(2){animation-delay:.06s}
#view section.wrap:nth-of-type(3){animation-delay:.12s}
#view section.wrap:nth-of-type(4){animation-delay:.18s}
#view section.wrap:nth-of-type(5){animation-delay:.24s}
#view section.wrap:nth-of-type(6){animation-delay:.3s}
.grid>.card{animation:fadeUp .45s var(--ease-out) backwards}
.grid>.card:nth-child(2){animation-delay:.05s}
.grid>.card:nth-child(3){animation-delay:.1s}
.grid>.card:nth-child(4){animation-delay:.15s}
.grid>.card:nth-child(5){animation-delay:.2s}
/* 히어로 내부 순차 등장 */
.hero>*{animation:fadeUp .55s var(--ease-out) backwards}
.hero>*:nth-child(2){animation-delay:.07s}
.hero>*:nth-child(3){animation-delay:.14s}
.hero>*:nth-child(4){animation-delay:.21s}
.hero>*:nth-child(5){animation-delay:.28s}
.hero>*:nth-child(6){animation-delay:.36s}
footer{border-top:1px solid var(--border);margin-top:70px;padding:38px 0 60px;
  background:var(--surface2)}
.ft{max-width:var(--maxw);margin:0 auto;padding:0 24px;display:flex;
  justify-content:space-between;gap:24px;flex-wrap:wrap;font-size:12.5px;color:var(--t3)}
.ft .serif{font-size:17px;color:var(--navy);margin-bottom:6px}
.ft-note{max-width:440px;line-height:1.7}

/* ═══════════════ E. COMPONENTS ═══════════════ */
/* — buttons — */
.btn{display:inline-flex;align-items:center;gap:8px;padding:11px 18px;border-radius:var(--radius);
  font-size:13.5px;font-weight:700;border:1px solid transparent;white-space:nowrap;
  transition:transform var(--dur-med) var(--ease-spring),box-shadow var(--dur-med) var(--ease-out),
    border-color var(--dur-fast) var(--ease-out),color var(--dur-fast) var(--ease-out)}
.btn:active{transform:scale(.985)}
.btn-primary{background:var(--navy);color:var(--t-inv)}
.theme-dark .btn-primary{background:var(--amber);color:#0A0E1A}
.btn-primary:hover{transform:translateY(-1px);box-shadow:var(--shadow-lg)}
.btn-gold{background:var(--gold);color:#fff}
.btn-ghost{border-color:var(--border);color:var(--t1);background:var(--surface)}
.btn-ghost:hover{border-color:var(--gold);color:var(--gold2)}
.btn-sm{padding:8px 13px;font-size:12.5px}

/* — badges / chips — */
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:99px;
  font-size:11px;font-weight:800;letter-spacing:.04em;font-family:var(--mono)}
.b-HOT{color:var(--red);background:var(--bad-bg)}
.b-RISE{color:var(--green);background:var(--c-green-bg)}
.b-WATCH{color:var(--amber);background:var(--c-orange-bg)}
.b-FALL{color:var(--red);background:var(--bad-bg)}
.b-NEW{color:var(--cyan);background:var(--c-blue-bg)}
.chip{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:99px;
  font-size:12px;font-weight:600;background:var(--surface2);color:var(--t2);
  border:1px solid var(--border)}
.chip-field{background:var(--navy-soft);color:var(--navy2);border-color:transparent}
.theme-dark .chip-field{color:var(--cyan)}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;
  padding:3px 8px;border-radius:var(--radius-sm)}
.tag-blue{color:var(--c-blue);background:var(--c-blue-bg)}
.tag-green{color:var(--c-green);background:var(--c-green-bg)}
.tag-purple{color:var(--c-purple);background:var(--c-purple-bg)}
.tag-orange{color:var(--c-orange);background:var(--c-orange-bg)}
.tag-gray{color:var(--c-gray);background:var(--c-gray-bg)}
/* 검수 씰 — 황동 인장(judicial seal). 그린은 감사 상태 전용으로 남긴다 */
.verified-seal{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:99px;
  font-size:12.5px;font-weight:700;color:var(--gold2);background:var(--gold-soft);
  font-family:var(--serif);letter-spacing:.02em;
  border:1px solid color-mix(in srgb,var(--gold) 45%,transparent);
  box-shadow:inset 0 0 0 2.5px var(--surface)}

/* — avatar — */
.av{display:flex;align-items:center;justify-content:center;flex-shrink:0;
  border-radius:14px;font-family:var(--serif);font-weight:700;color:#fff;
  background:linear-gradient(150deg,var(--navy),var(--navy2));letter-spacing:.02em}
.av-lg{width:112px;height:112px;font-size:40px;border-radius:20px}
.av-md{width:52px;height:52px;font-size:20px}
.av-sm{width:38px;height:38px;font-size:15px;border-radius:11px}

/* — stars — */
.stars{color:var(--gold);letter-spacing:1px;font-size:13px}
.stars .off{color:var(--border)}

/* — section head — */
/* 섹션 헤드 — 괘선 + 황동 키커 바(브로드시트 섹션 구분자) */
.sec-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;
  margin:0 0 18px;padding-bottom:12px;border-bottom:1px solid var(--border);position:relative}
.sec-head::after{content:"";position:absolute;left:0;bottom:-1px;width:48px;height:2px;background:var(--gold)}
.sec-head h2{font-family:var(--serif);font-size:24px;color:var(--navy);font-weight:700;
  letter-spacing:-.01em;text-wrap:balance;line-height:1.3}
.sec-head .more{font-size:13px;font-weight:700;color:var(--gold2)}
.sec-head .more:hover{text-decoration:underline}

/* — review card — */
.rev{padding:18px 20px;display:flex;flex-direction:column;gap:10px}
.rev .rev-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.rev .rev-src{font-family:var(--mono);font-size:10.5px;font-weight:800;color:var(--seal);
  background:var(--seal-soft);padding:2px 7px;border-radius:99px;letter-spacing:.03em}
.rev p{font-size:13.5px;color:var(--t1);line-height:1.62}
.rev .rev-by{font-size:12px;color:var(--t3)}

/* — lawyer / case / news mini card — */
.mini{padding:16px 18px;display:flex;gap:14px;align-items:flex-start;border-radius:var(--radius-lg);
  box-shadow:none;
  transition:transform var(--dur-med) var(--ease-spring),box-shadow var(--dur-med) var(--ease-out),
    border-color var(--dur-med) var(--ease-out)}
.mini:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:var(--gold)}
.mini .mini-body{flex:1;min-width:0}
.mini h3{font-size:15px;font-weight:700;color:var(--t1);margin-bottom:3px;line-height:1.3}
.mini .mini-sub{font-size:12.5px;color:var(--t2);margin-bottom:8px}
.mini .mini-meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center}

/* — gauge — */
.gauge-wrap{display:flex;flex-direction:column;align-items:center;gap:2px}
.gauge text.g-num{font-family:var(--mono);font-weight:800;font-size:26px;fill:var(--t1)}
.gauge text.g-lbl{font-size:8.5px;fill:var(--t3);font-weight:700;letter-spacing:.03em}

/* — 정량 수치 듀오(AI 인용수 · 사람 조회수) — */
.metric-duo{display:flex;gap:10px}
.metric-duo .metric{flex:1;min-width:104px;background:var(--surface);border:1px solid var(--border);
  border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:3px}
.metric-duo .m-lbl{display:flex;align-items:center;gap:5px;font-size:10.5px;font-weight:700;
  color:var(--t2);letter-spacing:.01em}
.metric-duo .m-ic{font-size:12px}
.metric-duo .m-val{font-family:var(--mono);font-size:22px;font-weight:800;color:var(--t1);
  line-height:1;font-variant-numeric:tabular-nums}
.metric-duo .metric.ai .m-val{color:var(--gold2)}
.metric-duo .metric.ai{background:linear-gradient(180deg,var(--gold-soft),var(--surface) 75%);
  border-color:color-mix(in srgb,var(--gold) 28%,transparent)}
.metric-duo .m-sub{font-size:9.5px;color:var(--t3);font-family:var(--mono)}

/* — 법조인 지표 스트립(경력·수임·응답) — */
.stat-strip{display:flex;gap:0;margin-top:16px;border:1px solid var(--border);
  border-radius:10px;overflow:hidden;width:fit-content;max-width:100%;flex-wrap:wrap}
.stat-strip .ss-item{display:flex;align-items:center;gap:7px;padding:9px 16px;
  font-size:12.5px;font-weight:600;color:var(--t2);background:var(--surface)}
.stat-strip .ss-item+.ss-item{border-left:1px solid var(--line)}
.stat-strip .ss-item b{color:var(--navy);font-weight:800}
.stat-strip .ss-ic{font-size:13px}

/* — 대표 성과(하이라이트) — */
.hl-row{display:flex;gap:14px;padding:13px 0;border-bottom:1px solid var(--line);align-items:flex-start}
.hl-row:last-child{border-bottom:none}
.hl-y{font-family:var(--serif);font-style:italic;font-size:15px;font-weight:700;
  color:var(--gold2);flex-shrink:0;width:44px;padding-top:1px}
.hl-t{font-size:13.5px;font-weight:700;color:var(--t1);line-height:1.4}
.hl-d{font-size:12.5px;color:var(--t2);margin-top:3px;line-height:1.5}

/* — 분야별 수임 분포(가로 바) — */
.fbar{display:flex;flex-direction:column;gap:10px}
.fbar .fb-row{display:grid;grid-template-columns:92px 1fr 34px;gap:10px;align-items:center}
.fbar .fb-lbl{font-size:12px;font-weight:600;color:var(--t2);white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.fbar .fb-track{height:8px;background:var(--surface2);border-radius:99px;overflow:hidden}
.fbar .fb-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--gold),var(--gold2));
  transform-origin:left;animation:fbGrow .8s var(--ease-out) backwards}
.fbar .fb-row:nth-child(2) .fb-fill{animation-delay:.08s}
.fbar .fb-row:nth-child(3) .fb-fill{animation-delay:.16s}
.fbar .fb-row:nth-child(4) .fb-fill{animation-delay:.24s}
.fbar .fb-n{font-family:var(--mono);font-size:11.5px;font-weight:800;color:var(--t1);text-align:right}
@keyframes fbGrow{from{transform:scaleX(0)}to{transform:scaleX(1)}}

/* — entity highlight + tooltip — */
.ent{position:relative;cursor:help;font-weight:600;white-space:nowrap;
  border-bottom:1.5px solid;padding-bottom:.5px;transition:background .15s}
.ent-lawyer{color:var(--navy2);border-color:var(--gold)}
.ent-case{color:var(--c-blue);border-color:var(--c-blue)}
.ent-company{color:var(--c-green);border-color:var(--c-green)}
.ent-judge{color:var(--c-purple);border-color:var(--c-purple)}
.ent-firm{color:var(--seal);border-color:var(--seal)}
.ent:hover{background:var(--gold-soft)}
/* — 정규화 툴팁 (화이트톤 · 고객 화면) — */
#tooltip{position:fixed;z-index:200;max-width:290px;background:var(--surface);color:var(--t1);
  padding:12px 14px;border-radius:10px;box-shadow:var(--shadow-lg);font-size:12.5px;
  border:1px solid var(--border);border-top:3px solid var(--gold);
  opacity:0;transform:translateY(4px);pointer-events:none;transition:.14s;line-height:1.5}
#tooltip.on{opacity:1;transform:translateY(0)}
#tooltip .tt-type{font-family:var(--mono);font-size:9.5px;font-weight:800;letter-spacing:.08em;
  text-transform:uppercase;color:var(--gold2);margin-bottom:5px}
#tooltip .tt-name{font-family:var(--serif);font-size:15px;margin-bottom:8px;color:var(--navy)}
#tooltip .tt-row{display:flex;justify-content:space-between;gap:14px;padding:3px 0;
  font-family:var(--mono);font-size:11px;border-bottom:1px solid var(--line)}
#tooltip .tt-row:last-of-type{border-bottom:none}
#tooltip .tt-row span:first-child{color:var(--t3)}
#tooltip .tt-row span:last-child{color:var(--t1);font-weight:700}
#tooltip .tt-cite{margin-top:8px;padding-top:8px;border-top:1px solid var(--border);
  font-size:10.5px;color:var(--gold2);font-weight:700}

/* — 메타정보 박스 (화이트톤 · 고객 화면) — */
.metabox{background:var(--surface);color:var(--t1);border-radius:var(--radius-lg);
  border:1px solid var(--border);box-shadow:var(--shadow-sm);
  padding:22px 24px;margin-top:32px}
.metabox .mb-head{display:flex;align-items:center;gap:10px;margin-bottom:4px}
.metabox .mb-head .serif{font-size:17px;color:var(--navy)}
.metabox .mb-sub{font-size:12px;color:var(--t3);margin-bottom:18px;
  font-family:var(--mono);padding-bottom:14px;border-bottom:1px solid var(--line)}
.mb-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.mb-item{background:var(--surface2);border:1px solid var(--border);
  border-radius:9px;padding:11px 13px;transition:.15s}
.mb-item:hover{background:var(--gold-soft);transform:translateY(-1px);border-color:var(--gold)}
.mb-item .mb-t{font-family:var(--mono);font-size:9px;font-weight:800;letter-spacing:.07em;
  text-transform:uppercase;margin-bottom:5px;color:var(--gold2)}
.mb-item .mb-n{font-size:13.5px;font-weight:700;color:var(--navy)}
.mb-item .mb-v{font-family:var(--mono);font-size:10.5px;color:var(--t2);margin-top:3px}

/* — data table — */
.dtable{width:100%;border-collapse:collapse;font-size:13px}
.dtable th{text-align:left;font-size:var(--label-fs);font-weight:800;letter-spacing:.08em;
  text-transform:uppercase;color:var(--navy2);padding:9px 12px;
  border-bottom:2px solid var(--navy)} /* 장부(ledger)식 헤더 괘선 */
.theme-dark .dtable th{border-bottom-color:var(--amber);color:var(--t2)}
.dtable td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:middle;
  font-variant-numeric:tabular-nums}
.dtable tr:last-child td{border-bottom:none}
.dtable tr.clk{cursor:pointer;transition:.13s}
.dtable tr.clk:hover td{background:var(--surface2)}
.dtable .mono{font-size:12px;color:var(--t2)}

/* — timeline — */
.tl{position:relative;padding-left:26px}
.tl::before{content:"";position:absolute;left:7px;top:5px;bottom:5px;width:2px;
  background:linear-gradient(to bottom,
    color-mix(in srgb,var(--gold) 55%,var(--border)),var(--border) 80%)}
.tl-item:not(.done)::before{border-color:var(--border);border-style:dashed}
.tl-item:not(.done) .tl-d,.tl-item:not(.done) .tl-e{color:var(--t3)}
.tl-item{position:relative;padding:0 0 20px}
.tl-item:last-child{padding-bottom:0}
.tl-item::before{content:"";position:absolute;left:-24px;top:4px;width:12px;height:12px;
  border-radius:99px;background:var(--surface);border:2.5px solid var(--gold)}
.tl-item.done::before{background:var(--gold)}
.tl-d{font-family:var(--mono);font-size:11px;color:var(--gold2);font-weight:700}
.tl-e{font-size:13.5px;color:var(--t1);margin-top:2px}

/* ── 실시간 레이더 (화이트톤) — 상단 황동 블룸 + 헤어라인 프레임 ── */
.radar{background:
    radial-gradient(120% 70% at 50% -10%,var(--gold-soft),transparent 55%),
    var(--surface);
  border:1px solid var(--border);
  border-radius:20px;padding:26px 26px 30px;overflow:hidden;
  position:relative;box-shadow:var(--shadow)}
.radar .breaking{display:flex;align-items:center;gap:0;background:var(--amber);color:#0A0E1A;
  border-radius:8px;overflow:hidden;margin-bottom:22px;font-weight:800;font-size:12px}
.radar .bk-lbl{padding:7px 12px;background:rgba(0,0,0,.16);white-space:nowrap;
  font-family:var(--mono);letter-spacing:.06em;display:flex;align-items:center;gap:6px}
.radar .bk-scroll{overflow:hidden;flex:1;position:relative;height:32px}
.radar .bk-track{position:absolute;white-space:nowrap;display:flex;gap:40px;
  padding-left:16px;line-height:32px;animation:marquee 26s linear infinite}
.radar-head{display:flex;align-items:center;gap:11px;margin-bottom:18px}
.radar-head .serif{font-size:21px;color:var(--t1);font-style:italic}
.live-dot{width:8px;height:8px;border-radius:99px;background:var(--red);
  box-shadow:0 0 0 0 rgba(255,90,90,.6);animation:ld 2s infinite}
.radar-head .lv{font-family:var(--mono);font-size:10.5px;font-weight:800;color:var(--red);
  letter-spacing:.1em}
.radar-grid{display:grid;grid-template-columns:1.15fr .85fr;gap:16px}
@media(max-width:760px){.radar-grid{grid-template-columns:1fr}}
.rcards{display:grid;grid-template-columns:1fr 1fr;gap:11px}
@media(max-width:520px){.rcards{grid-template-columns:1fr}}
.rcard{background:var(--surface2);border-radius:9px;padding:13px 14px 13px 17px;
  position:relative;overflow:hidden;cursor:default;
  transition:transform var(--dur-med) var(--ease-spring),background var(--dur-fast) var(--ease-out)}
.rcard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--rc)}
.rcard:hover{background:var(--surface3);transform:translateY(-2px)}
.rcard .rc-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px}
.rcard .rc-rank{font-family:var(--serif);font-style:italic;font-size:20px;
  color:color-mix(in srgb,var(--gold) 70%,var(--t3))}
.rcard .rc-label{font-size:13px;font-weight:700;color:var(--t1);line-height:1.35;
  margin-bottom:10px;min-height:34px}
.rcard .rc-bottom{display:flex;align-items:flex-end;justify-content:space-between;gap:8px}
.rc-spark{display:flex;align-items:flex-end;gap:2px;height:24px}
.rc-spark i{width:5px;background:var(--rc);border-radius:1px;opacity:.85;display:block}
.rc-mo{font-family:var(--mono);font-size:15px;font-weight:800;color:var(--t1)}
.ticker{background:var(--surface2);border-radius:9px;overflow:hidden;
  border:1px solid var(--border)}
/* 앰버는 '신호'로만 — 티커 헤더는 다크 서피스 + 앰버 타이프로 절제 */
.ticker .tk-head{background:var(--gold-soft);color:var(--amber);padding:9px 15px;font-weight:800;
  font-size:12px;font-family:var(--mono);letter-spacing:.05em;display:flex;
  align-items:center;justify-content:space-between;
  border-bottom:1px solid color-mix(in srgb,var(--amber) 25%,transparent)}
.tk-row{display:flex;align-items:center;gap:12px;padding:11px 15px;
  border-bottom:1px solid var(--line);transition:.13s;cursor:default}
.tk-row:last-child{border-bottom:none}
.tk-row:hover{background:var(--surface3)}
.tk-num{font-family:var(--serif);font-style:italic;font-size:17px;color:var(--gold);
  width:22px;flex-shrink:0}
.tk-label{flex:1;font-size:12.5px;font-weight:600;color:var(--t1)}
.tk-val{font-family:var(--mono);font-size:12px;font-weight:700;color:var(--t2)}

/* — verdict card (audit) — */
.verdict{border-radius:var(--radius-lg);padding:18px 20px;border:1px solid var(--border);
  border-left:4px solid var(--warn);background:var(--surface);transition:.2s}
.verdict.v-verified{border-left-color:var(--ok)}
.verdict.v-disputed{border-left-color:var(--bad)}
.verdict.auditing{border-left-color:var(--cyan)}
.v-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
.v-status{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:800;
  font-family:var(--mono);letter-spacing:.05em;padding:4px 10px;border-radius:99px}
.v-status.s-pending{color:var(--warn);background:var(--warn-bg)}
.v-status.s-verified{color:var(--ok);background:var(--ok-bg)}
.v-status.s-disputed{color:var(--bad);background:var(--bad-bg)}
.v-quote{font-family:var(--serif);font-size:14.5px;line-height:1.55;color:var(--t1);
  padding:10px 14px;background:var(--surface2);border-radius:8px;margin-bottom:12px;
  border-left:2px solid var(--hair)} /* 좌측 액센트는 카드 상태 엣지 하나만 */
.v-claim{font-size:12.5px;color:var(--t2);margin-bottom:12px}
.v-claim b{color:var(--t1)}
.v-sources{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.v-src{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--t2);
  font-family:var(--mono)}
.v-src .ic{width:20px;text-align:center}
.v-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding-top:12px;border-top:1px solid var(--line);font-size:11.5px;color:var(--t3);
  font-family:var(--mono);flex-wrap:wrap}
.v-audit-meta{display:flex;gap:14px;flex-wrap:wrap}
.v-audit-meta b{color:var(--t2);font-weight:700}
.spinner{width:13px;height:13px;border:2px solid var(--cyan);border-top-color:transparent;
  border-radius:99px;animation:spin .7s linear infinite;display:inline-block}

/* — HITL rail — */
.hitl{display:flex;align-items:stretch;gap:0;margin-bottom:26px;flex-wrap:wrap}
.hitl-step{flex:1;min-width:130px;display:flex;flex-direction:column;gap:5px;
  padding:15px 16px;background:var(--surface);border:1px solid var(--border);position:relative}
.hitl-step:first-child{border-radius:var(--radius) 0 0 var(--radius)}
.hitl-step:last-child{border-radius:0 var(--radius) var(--radius) 0}
.hitl-step.human{background:var(--warn-bg);border-color:color-mix(in srgb,var(--warn) 35%,transparent)}
.hitl-step .hs-ic{font-size:19px}
.hitl-step .hs-n{font-family:var(--mono);font-size:9.5px;font-weight:800;color:var(--t3);
  letter-spacing:.08em}
.hitl-step .hs-t{font-size:12.5px;font-weight:700;color:var(--t1)}
.hitl-step .hs-d{font-size:11px;color:var(--t2);line-height:1.4}
.hitl-step+.hitl-step{margin-left:-1px} /* 이중 seam 제거 */
.audit-criteria{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:-12px 0 22px;
  padding:12px 16px;background:var(--surface);border:1px dashed var(--border);border-radius:10px}
.audit-criteria .ac-lbl{font-family:var(--mono);font-size:10px;font-weight:800;
  letter-spacing:.07em;color:var(--amber);margin-right:4px}
.audit-criteria .ac-chip{font-size:11.5px;font-weight:600;color:var(--t2);
  background:var(--surface2);border:1px solid var(--border);padding:4px 10px;border-radius:99px}
.hitl-step .hs-arrow{position:absolute;right:-11px;top:50%;transform:translateY(-50%);
  z-index:2;color:var(--gold);font-size:11px;width:20px;height:20px;border-radius:99px;
  background:var(--surface2);border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 1px 3px rgba(0,0,0,.4)}

/* — pipeline (crawler) — */
.pipe{position:relative;padding:8px 0}
.pipe-stage{display:flex;flex-direction:column;gap:11px}
.pnode{background:var(--surface);border:1px solid var(--border);border-radius:11px;
  padding:13px 15px;display:flex;align-items:center;gap:11px;transition:.16s;position:relative}
.pnode:hover{border-color:var(--amber);transform:translateX(2px)}
.pnode .pn-ic{width:34px;height:34px;border-radius:9px;background:var(--surface2);
  display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.pnode .pn-name{font-size:13px;font-weight:700;color:var(--t1)}
.pnode .pn-sub{font-family:var(--mono);font-size:10.5px;color:var(--t2)}
.pnode .pn-count{margin-left:auto;font-family:var(--mono);font-size:13px;font-weight:800;
  color:var(--amber)}
.pn-status{width:7px;height:7px;border-radius:99px;background:var(--green);
  box-shadow:0 0 0 0 var(--green);animation:ld 2.2s infinite}
.stage-lbl{font-family:var(--mono);font-size:10.5px;font-weight:800;letter-spacing:.09em;
  text-transform:uppercase;color:var(--amber);margin-bottom:12px;display:flex;
  align-items:center;gap:8px}
.stage-lbl::after{content:"";flex:1;height:1px;background:var(--border)}
.flow-svg{width:100%;height:40px;display:block}
.flow-svg path{stroke:var(--amber);stroke-width:1.5;fill:none;stroke-dasharray:6 6;
  opacity:.5;animation:march 1s linear infinite}
.mask-chip{display:inline-flex;align-items:center;gap:8px;font-family:var(--mono);
  font-size:12px;padding:6px 11px;border-radius:7px;background:var(--surface2)}
.mask-chip .arrow{color:var(--amber)}
.mask-chip .before{color:var(--t3);text-decoration:line-through}
.mask-chip .after{color:var(--green);font-weight:700}

/* — live crawler (크롤러 실황) — */
.lc-engines{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.lc-engine{display:inline-flex;align-items:center;gap:7px;font-family:var(--mono);font-size:11.5px;
  font-weight:700;color:var(--t1);background:var(--surface2);border:1px solid var(--border);
  padding:7px 13px;border-radius:99px}
.lc-engine em{font-style:normal;color:var(--cyan);font-size:10px;font-weight:600}
.lc-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:20px}
@media(max-width:900px){.lc-grid{grid-template-columns:1fr}}
.lc-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;
  padding:16px 17px;display:flex;flex-direction:column;gap:11px;transition:border-color var(--dur-med) var(--ease-out)}
.lc-card.on{border-color:var(--amber)}
.lc-card.done{border-color:color-mix(in srgb,var(--green) 45%,transparent)}
.lc-head{display:flex;align-items:flex-start;gap:11px}
.lc-ic{width:34px;height:34px;border-radius:9px;background:var(--surface2);display:flex;
  align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.lc-name{font-size:13px;font-weight:700;color:var(--t1);line-height:1.3}
.lc-url{font-size:10.5px;color:var(--t3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.lc-badge{flex-shrink:0;font-family:var(--mono);font-size:10.5px;font-weight:800;letter-spacing:.03em;
  padding:3px 9px;border-radius:99px;background:var(--surface2)}
.lc-badge.lc-wait{color:var(--t3)}
.lc-badge.lc-conn,.lc-badge.lc-recv{color:var(--cyan)}
.lc-badge.lc-parse,.lc-badge.lc-norm{color:var(--amber)}
.lc-badge.lc-done{color:var(--green)}
.lc-badge .spinner{width:9px;height:9px;border-width:2px;vertical-align:-1px;margin-right:3px}
.lc-bar{height:6px;background:var(--surface2);border-radius:99px;overflow:hidden}
.lc-bar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--amber),var(--amber2));
  border-radius:99px;transition:width .45s var(--ease-out)}
.lc-net{font-size:10.5px;color:var(--t2);display:flex;gap:6px;flex-wrap:wrap}
.lc-xform{position:relative;background:var(--paper);border:1px solid var(--border);border-radius:8px;
  min-height:132px;overflow:hidden}
.lc-raw{margin:0;padding:11px 13px;font-size:10px;line-height:1.5;color:var(--t3);white-space:pre-wrap;
  word-break:break-all;max-height:132px;overflow:auto;transition:opacity .35s var(--ease-out)}
.lc-raw.fade-out{opacity:0}
.lc-fields{position:absolute;inset:0;width:100%;border-collapse:collapse;opacity:0;
  padding:6px;transition:opacity .35s var(--ease-out);pointer-events:none}
.lc-fields.fade-in{opacity:1;pointer-events:auto}
.lc-fields td{padding:6px 12px;border-bottom:1px solid var(--line);font-size:11.5px;vertical-align:top}
.lc-fields tr:last-child td{border-bottom:none}
.lc-fields td:first-child{color:var(--t3);font-family:var(--mono);font-size:10px;white-space:nowrap;width:1%}
.lc-fields td:last-child{color:var(--t1);font-weight:700}
.lc-fields tr.golink td{color:var(--cyan);font-weight:700;cursor:pointer}
.lc-console{background:#05070f;border:1px solid var(--border);border-radius:12px;overflow:hidden}
.lc-console-head{padding:8px 15px;font-size:11px;color:var(--amber);font-weight:800;
  border-bottom:1px solid var(--border);background:var(--surface2)}
.lc-log{padding:12px 15px;font-size:11px;line-height:1.7;max-height:190px;overflow:auto;color:var(--t2)}
.lc-log-line{white-space:pre-wrap;word-break:break-all}
.lc-log-line .ts{color:var(--t3)}
.lc-log-line.ok{color:var(--green)}
.lc-export-out{margin-top:18px;background:var(--surface);border:1px solid var(--border);border-radius:12px;
  padding:16px 18px}
.lc-export-out .lc-export-head{font-family:var(--mono);font-size:11.5px;color:var(--amber);
  font-weight:800;margin-bottom:10px}
.lc-export-out pre{font-family:var(--mono);font-size:10.5px;line-height:1.5;color:var(--t1);
  white-space:pre-wrap;word-break:break-all;max-height:280px;overflow:auto}

/* — stat tiles — */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px}
.tile{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);
  padding:18px 20px}
.tile .tl-lbl{font-size:11.5px;font-weight:700;color:var(--t2);margin-bottom:8px;
  letter-spacing:.02em}
.tile .tl-val{font-family:var(--mono);font-size:30px;font-weight:800;color:var(--t1);
  line-height:1;letter-spacing:-.02em}
.tile .tl-delta{font-size:12px;font-weight:700;margin-top:8px;display:inline-flex;
  align-items:center;gap:4px;font-variant-numeric:tabular-nums}
.tile .up{color:var(--green)} .tile .down{color:var(--red)}
/* 리드 스탯 타일 — 시선이 착지할 하나의 지점 */
.tiles .tile:first-child{
  border-color:color-mix(in srgb,var(--gold) 35%,transparent);
  background:linear-gradient(180deg,var(--gold-soft),var(--surface) 70%)}
.tiles .tile:first-child .tl-val{color:var(--gold);
  text-shadow:0 0 20px color-mix(in srgb,var(--gold) 35%,transparent)}
/* 앰버 수치 인광(phosphor) 글로우 */
.theme-dark .pn-count,.theme-dark [data-total],.theme-dark [data-total2]{
  text-shadow:0 0 18px color-mix(in srgb,var(--gold) 45%,transparent)}

/* — 법률 어시스턴트: 중앙 하단 플로팅 독 (모든 화면 상시 노출) — */
#chat-root{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:120;
  display:flex;flex-direction:column;align-items:center;gap:12px;
  max-width:calc(100vw - 32px)}
.chat-fab{display:flex;align-items:center;gap:11px;padding:12px 22px 12px 14px;
  background:color-mix(in srgb,var(--navy) 96%,transparent);color:var(--t-inv);
  border-radius:99px;box-shadow:var(--shadow-lg),0 0 0 1px rgba(255,255,255,.07) inset;
  backdrop-filter:saturate(1.4) blur(10px);
  font-weight:700;font-size:14px;white-space:nowrap;
  transition:transform var(--dur-med) var(--ease-spring),box-shadow var(--dur-med) var(--ease-out)}
.chat-fab:hover{transform:translateY(-2px) scale(1.02)}
.chat-fab .cf-hint{font-weight:500;font-size:12px;color:rgba(245,242,236,.55);
  border-left:1px solid rgba(255,255,255,.18);padding-left:11px}
.chat-fab.is-open .cf-hint{display:none}
@media(max-width:560px){.chat-fab .cf-hint{display:none}}
.chat-fab .cf-ic{width:28px;height:28px;border-radius:99px;
  background:linear-gradient(140deg,var(--gold),var(--gold2));display:flex;
  align-items:center;justify-content:center;font-family:var(--serif);font-weight:800;
  color:#fff;font-size:15px}
.chat-fab .cf-p{width:7px;height:7px;border-radius:99px;background:var(--green);
  animation:ld 2s infinite}
.chat-panel{width:390px;max-width:calc(100vw - 40px);height:520px;max-height:calc(100vh - 140px);
  background:var(--surface);border:1px solid var(--border);border-radius:18px;
  box-shadow:var(--shadow-lg);display:none;flex-direction:column;overflow:hidden;
  transform-origin:50% calc(100% + 24px)} /* 독 중앙에서 피어남 */
.chat-panel.open{display:flex;animation:panelIn .34s cubic-bezier(.33,1.25,.45,1)}
.chat-panel.closing{display:flex;animation:panelOut .18s var(--ease-out) forwards}
.cp-head{padding:15px 18px;background:var(--navy);color:var(--t-inv);display:flex;
  align-items:center;gap:11px}
.cp-head .cp-ic{width:34px;height:34px;border-radius:11px;
  background:linear-gradient(140deg,var(--gold),var(--gold2));display:flex;
  align-items:center;justify-content:center;font-family:var(--serif);font-weight:800;
  color:#fff;font-size:17px}
.cp-head .cp-t{font-weight:800;font-size:14px}
.cp-head .cp-s{font-size:11px;color:rgba(245,242,236,.6);font-family:var(--mono)}

.cp-head .cp-x:hover{background:rgba(255,255,255,.1)}
.cp-body{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:12px;

.msg{max-width:82%;padding:11px 14px;border-radius:14px;font-size:13px;line-height:1.5}
.msg.bot{align-self:flex-start;background:var(--surface);border:1px solid var(--border);

/* — modal / report — */
#modal-root{position:fixed;inset:0;z-index:180;display:none;align-items:center;

/* — toast — */
#toast-root{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:220;

.toast .tk{color:var(--green);font-weight:800}

/* — 광고 배너(좌상단 · 수익모델 시연) — */
.ad-banner{display:flex;align-items:center;gap:11px;width:fit-content;max-width:100%;

.ad-banner:hover{transform:translateY(-1px);box-shadow:var(--shadow-lg)}
.ad-banner .ad-chip{font-family:var(--mono);font-size:9px;font-weight:800;letter-spacing:.08em;
  padding:3px 7px;border-radius:5px;background:var(--gold);color:#fff;flex-shrink:0}
.ad-banner b{color:var(--gold2);filter:brightness(1.6)}
.ad-banner .ad-cta{font-size:11px;font-weight:700;color:rgba(245,242,236,.65);
  border-left:1px solid rgba(255,255,255,.18);padding-left:10px;margin-left:2px;white-space:nowrap}

/* — hero — */
.hero{padding:26px 0 30px;text-align:center}
/* 마스트헤드식 아이브로 — 양옆으로 사라지는 황동 괘선 */
.hero .h-eyebrow{margin-bottom:18px;display:flex;align-items:center;justify-content:center;gap:14px}
.hero .h-eyebrow::before,.hero .h-eyebrow::after{content:"";width:64px;height:1px;flex-shrink:0}
.hero .h-eyebrow::before{background:linear-gradient(90deg,transparent,var(--gold))}
.hero .h-eyebrow::after{background:linear-gradient(90deg,var(--gold),transparent)}
.hero h1{font-family:var(--serif);font-size:clamp(30px,5vw,46px);color:var(--navy);font-weight:600;
  line-height:1.18;letter-spacing:-.018em;text-wrap:balance;margin-bottom:16px}
.hero h1 em{font-style:italic;color:var(--gold2)}
.hero .h-lead{font-size:16px;color:var(--t2);max-width:560px;margin:0 auto 30px;line-height:1.65}
/* 검색바 — 히어로의 유일한 초점: 가장 깊은 그림자 + 네이비 AI 코인 */
.searchbar{max-width:640px;margin:0 auto;background:var(--surface);
  border:1.5px solid color-mix(in srgb,var(--gold) 30%,var(--border));

.searchbar:focus-within{border-color:var(--gold);box-shadow:0 0 0 4px var(--gold-soft),var(--shadow-lg)}
.searchbar .sb-ai{font-family:var(--serif);font-weight:800;font-size:12.5px;flex-shrink:0;
  width:30px;height:30px;border-radius:99px;display:flex;align-items:center;justify-content:center;
  background:var(--navy);color:var(--gold-soft)}
.searchbar input{flex:1;border:none;background:none;outline:none;font-size:15px;
  color:var(--t1);font-family:var(--sans)}
.searchbar input::placeholder{color:var(--t3)}
.h-suggests{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:16px}
.h-suggest{font-size:12.5px;color:var(--t2);padding:6px 13px;border-radius:99px;
  background:var(--surface);border:1px solid var(--border);cursor:pointer;
  transition:transform var(--dur-fast) var(--ease-spring),border-color var(--dur-fast) var(--ease-out),
    color var(--dur-fast) var(--ease-out)}
.h-suggest:hover{border-color:var(--gold);color:var(--gold2);transform:translateY(-1px)}
.h-diff{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:36px}
.h-diff .hd-card{display:flex;align-items:center;gap:11px;padding:12px 18px;

  font-size:13px;box-shadow:var(--shadow-sm)}
.h-diff .hd-vs{font-family:var(--mono);font-size:10.5px;font-weight:800;color:var(--t3)}
.h-diff .hd-txt b{color:var(--navy)}
.h-diff .hd-check{width:18px;height:18px;border-radius:99px;background:var(--gold-soft);
  color:var(--gold2);display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:800;flex-shrink:0}

/* — page-scoped: lawyer detail — */
.lw-hero{display:flex;gap:28px;align-items:flex-start;flex-wrap:wrap}
.lw-id{flex:1;min-width:240px}
.lw-name{font-family:var(--serif);font-size:32px;color:var(--navy);font-weight:700;
  display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.lw-name .hanja{font-size:18px;color:var(--t3)}
.lw-role{font-size:14px;color:var(--t2);margin-top:4px}
.lw-fields{display:flex;gap:7px;flex-wrap:wrap;margin-top:14px}
.lw-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:680px){.info-grid{grid-template-columns:1fr}}
.info-block h4{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;
  color:var(--gold2);margin-bottom:11px}
.info-list{display:flex;flex-direction:column;gap:8px;font-size:13.5px}
.info-list li{list-style:none;padding-left:16px;position:relative;color:var(--t1)}
.info-list li::before{content:"—";position:absolute;left:0;color:var(--gold)}

/* — 사건 상세 리치 필드 — */
.case-result{display:inline-block;margin-top:12px;padding:7px 14px;border-radius:8px;
  font-weight:800;font-size:13.5px;color:var(--gold2);background:var(--gold-soft);
  border:1px solid color-mix(in srgb,var(--gold) 35%,transparent)}
.issue-list{margin:0;padding-left:0;list-style:none;counter-reset:issue}
.issue-list li{counter-increment:issue;position:relative;padding:8px 0 8px 34px;
  font-size:13.5px;line-height:1.6;border-bottom:1px solid var(--line)}
.issue-list li:last-child{border-bottom:none}
.issue-list li::before{content:counter(issue);position:absolute;left:0;top:9px;
  width:22px;height:22px;border-radius:99px;background:var(--navy-soft);color:var(--navy);
  font-family:var(--serif);font-style:italic;font-size:13px;font-weight:700;
  display:flex;align-items:center;justify-content:center}
.statute-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.statute-chip{font-family:var(--mono);font-size:11.5px;font-weight:800;color:var(--navy);
  background:var(--navy-soft);padding:4px 10px;border-radius:6px;white-space:nowrap}
.statute-note{font-size:12.5px;color:var(--t2)}

/* — tabs / filter — */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:22px}
.tab{padding:11px 18px;font-size:14px;font-weight:700;color:var(--t2);position:relative;
  transition:.14s}
.tab:hover{color:var(--t1)}
.tab[aria-selected="true"]{color:var(--navy)}
.tab[aria-selected="true"]::after{content:"";position:absolute;left:12px;right:12px;bottom:-1px;
  height:2.5px;background:var(--gold);border-radius:2px}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.fchip{font-size:12.5px;font-weight:600;padding:7px 14px;border-radius:99px;
  background:var(--surface);border:1px solid var(--border);color:var(--t2);transition:.14s}
.fchip:hover{border-color:var(--gold)}
.fchip.on{background:var(--navy);color:var(--t-inv);border-color:var(--navy)}

/* — article — */
.article{max-width:720px;margin:0 auto}
.art-head .art-section{margin-bottom:12px}
.art-head h1{font-family:var(--serif);font-size:clamp(26px,4vw,36px);color:var(--navy);
  line-height:1.25;letter-spacing:-.01em;text-wrap:balance;margin-bottom:16px}
.art-byline{display:flex;align-items:center;gap:14px;padding:14px 0;
  border-top:1px solid var(--border);border-bottom:1px solid var(--border);
  font-size:12.5px;color:var(--t2);font-family:var(--mono);margin-bottom:28px;flex-wrap:wrap}
.art-body{font-family:var(--serif);font-size:16.5px;line-height:1.85;color:var(--t1)}
.art-body p{margin-bottom:20px}
/* 리드 문단 드롭캡 — 에디토리얼 보이스의 방점 */
.art-body>p:first-of-type::first-letter{float:left;font-family:var(--serif);
  font-size:46px;line-height:.9;font-weight:700;color:var(--navy);padding:5px 10px 0 0}
.art-body .art-h{font-family:var(--sans);font-weight:800;font-size:14px;color:var(--navy);
  letter-spacing:.02em;margin:30px 0 14px;display:block}
.duo-float{float:right;margin:0 0 16px 24px}
.duo-float .metric-duo{flex-direction:column;gap:8px}
.duo-float .metric{min-width:132px}
@media(max-width:560px){.duo-float{float:none;margin:0 0 20px}
  .duo-float .metric-duo{flex-direction:row}}

/* — bar/line chart — */
.chart-svg{width:100%;display:block;overflow:visible}
.chart-svg .grid-l{stroke:var(--line);stroke-width:1}
/* transform-box:fill-box — SVG rect의 스케일 기준을 viewBox가 아닌 자기 박스로(축 아래에서 미끄러지는 버그 수정) */
.chart-svg .bar{fill:url(#barGrad);transform-box:fill-box;transform-origin:50% 100%;transform:scaleY(0);
  animation:barGrow .8s cubic-bezier(.2,.7,.3,1) forwards}
.chart-svg .area{fill:url(#areaGrad);opacity:.9}
.chart-svg .line-p{fill:none;stroke:var(--amber);stroke-width:2.5;stroke-linecap:round;
  stroke-linejoin:round}
/* 엔드닷 — 선이 다 그려진 뒤 착지(pop) + 인광 */
.chart-svg .dot-end{fill:var(--amber2);transform-box:fill-box;transform-origin:center;
  opacity:0;animation:dotPop .35s cubic-bezier(.34,1.5,.5,1) 1.15s forwards;
  filter:drop-shadow(0 0 5px color-mix(in srgb,var(--amber2) 80%,transparent))}
.chart-svg text{font-family:var(--mono);font-size:10px;fill:var(--t3)}

/* — page intro (admin) — */
.padmin{padding:30px 0 0}
.padmin-head{margin-bottom:26px}
.padmin-head .eyebrow{color:var(--amber)}
.padmin-head h1{font-family:var(--serif);font-size:28px;color:var(--t1);margin:8px 0 6px;
  font-style:italic}
.padmin-head p{font-size:14px;color:var(--t2);max-width:640px}
.admin-tabs{display:flex;gap:4px;margin-bottom:26px;flex-wrap:wrap}
.admin-tab{padding:9px 16px;border-radius:99px;font-size:13px;font-weight:700;color:var(--t2);
  background:var(--surface);border:1px solid var(--border);transition:.14s}
.admin-tab:hover{border-color:var(--amber)}
.admin-tab[aria-current="page"]{background:var(--gold-soft);color:var(--amber);
  border-color:color-mix(in srgb,var(--amber) 45%,transparent)} /* 앰버 절제 — 세 번째 솔리드 앰버 제거 */

/* ── 상세 그리드 반응형(모바일 1열 축소) ── */
.split{grid-template-columns:1.5fr 1fr;gap:22px}
.split-even{grid-template-columns:1fr 1fr;gap:22px}
@media(max-width:820px){.split,.split-even{grid-template-columns:1fr}}
/* ── 오버라인 라벨 마이크로 타이포 통일 ── */
.info-block h4,.rs-sec h4,.stage-lbl,#tooltip .tt-type,.mb-item .mb-t,.hitl-step .hs-n{
  font-size:var(--label-fs);letter-spacing:var(--track-label)}
/* ── 메인 섹션 수직 리듬 단일화 ── */
#view section.wrap+section.wrap{margin-top:56px}
/* ── 세리프 디스플레이 행간(body 1.6 상속 차단) ── */
h1.serif{line-height:1.28;letter-spacing:-.012em;font-weight:600}
.padmin-head h1{line-height:1.3}
.v-audit-meta{font-variant-numeric:tabular-nums}

/* ═══════════════ ANIMATIONS ═══════════════ */
@keyframes ld{0%{box-shadow:0 0 0 0 currentColor}70%{box-shadow:0 0 0 7px transparent}100%{box-shadow:0 0 0 0 transparent}}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes marquee{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes march{to{stroke-dashoffset:-12}}
@keyframes bounce{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-5px);opacity:1}}
@keyframes toastIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes toastOut{to{opacity:0;transform:translateY(8px)}}
@keyframes barGrow{to{transform:scaleY(1)}}
@keyframes panelIn{from{opacity:0;transform:translateY(16px) scale(.92)}to{opacity:1;transform:none}}
@keyframes panelOut{to{opacity:0;transform:translateY(12px) scale(.95)}}
@keyframes dotPop{from{opacity:0;transform:scale(0)}to{opacity:1;transform:scale(1)}}
.toast.out{animation:toastOut .3s ease forwards}
.bk-scroll:hover .bk-track{animation-play-state:paused}

/* ═══════════════ RESPONSIVE ═══════════════ */
@media(max-width:820px){
  .nav{display:none}
  .hero{padding:40px 0 20px}
  .info-grid{grid-template-columns:1fr}
  .chat-panel{width:340px}
}
@media(prefers-reduced-motion:reduce){
  *{animation-duration:.001s!important;animation-iteration-count:1!important;
    animation-delay:0s!important;scroll-behavior:auto!important;transition-duration:.05s!important}
  .bk-track{animation:none}
}

/* ═══════════════ PRINT (report only) ═══════════════ */
@media print{
  body *{visibility:hidden!important}
  #modal-root,#modal-root *{visibility:visible!important}
  #modal-root{position:absolute;background:#fff;padding:0;display:block!important}
  .report-sheet{box-shadow:none;max-height:none;width:100%;border-radius:0}
  .modal-actions,.no-print{display:none!important}
  @page{size:A4;margin:16mm}
}

/* ═══════════════════════════════════════════════════════════════

/* ───────────── DB : 교차링크 가상 데이터 그래프 ───────────── */
const DB = {

/* ───────────── 헬퍼 ───────────── */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const initials=n=>n.slice(0,2);
const lw=id=>DB.lawyers[id], cs=id=>DB.cases[id], nw=id=>DB.news[id], fm=id=>DB.firms[id];
const fieldTag=(f,i)=>`<span class="tag tag-${["blue","green","purple","orange","gray"][i%5]}">${esc(f)}</span>`;
let activeTimers=[];
function clearTimers(){activeTimers.forEach(t=>{clearInterval(t);clearTimeout(t)});activeTimers=[]}
function stars(r){let s="";for(let i=1;i<=5;i++)s+=i<=r?"★":'<span class="off">★</span>';return `<span class="stars">${s}</span>`}
function nowKST(){return "2026-07-23 "+["11:47","11:48","11:49","11:52"][Math.floor(Math.random()*4)]+" KST"}

/* ───────────── 엔티티 렌더 (뉴스 본문의 §type:ID → span) ───────────── */
const ENT_LABEL={
  lawyer:id=>lw(id)?.name+" 변호사", case:id=>cs(id)?.no,
  company:id=>DB.companies[id]?.name, judge:id=>DB.judges[id]?.name+" 판사",
  firm:id=>fm(id)?.name };
function renderEntities(str){
  return esc(str).replace(/§(\w+):(\w+)/g,(_,type,id)=>{
    const label=ENT_LABEL[type]?ENT_LABEL[type](id):id;
    return `<span class="ent ent-${type}" data-etype="${type}" data-eid="${id}">${esc(label)}</span>`;
  });
}
function describeEntity(type,id){
  if(type==="lawyer"){const x=lw(id);return{t:"법조인 · LAWYER",n:x.name+" ("+x.hanja+")",rows:[["소속",fm(x.firm).name],["주요분야",x.fields.join(" · ")],["AI 인용",x.cite+"건"],["조회",x.views.toLocaleString()]],to:"#/lawyer/"+id};}
  if(type==="case"){const x=cs(id);return{t:"사건 · CASE",n:x.no,rows:[["사건명",x.title],["법원",x.court],["상태",x.status]],to:"#/case/"+id};}
  if(type==="company"){const x=DB.companies[id];return{t:"상장사 · LISTED CO.",n:x.name,rows:[["종목코드",x.ticker],["시장",x.market],["섹터",x.sector]],to:null};}
  if(type==="judge"){const x=DB.judges[id];return{t:"판사 · JUDGE",n:x.name,rows:[["재판부",x.court],["비고",x.note]],to:null};}
  if(type==="firm"){const x=fm(id);return{t:"로펌 · LAW FIRM",n:x.name,rows:[["설립",x.est+"년"],["구성",x.desc]],to:"#/firm/"+id};}
  return{t:type,n:id,rows:[]};
}

/* ───────────── 컴포넌트 (문자열 반환) ───────────── */
const C={
  gauge(n,size=118){
    const R=42,CIRC=2*Math.PI*R,off=CIRC*(1-n/100);
    const col=n>=80?"var(--ok)":n>=60?"var(--warn)":"var(--seal)";
    return `<div class="gauge-wrap"><svg class="gauge" width="${size}" height="${size}" viewBox="0 0 118 118">
      <circle cx="59" cy="59" r="${R}" fill="none" stroke="var(--surface2)" stroke-width="9"/>
      <circle cx="59" cy="59" r="${R}" fill="none" stroke="${col}" stroke-width="9" stroke-linecap="round"
        stroke-dasharray="${CIRC.toFixed(1)}" stroke-dashoffset="${CIRC.toFixed(1)}" data-goff="${off.toFixed(1)}"
        transform="rotate(-90 59 59)" style="transition:stroke-dashoffset 1.1s cubic-bezier(.2,.7,.3,1)"/>
      <text x="59" y="56" text-anchor="middle" class="g-num">${n}</text>
      <text x="59" y="74" text-anchor="middle" class="g-lbl">AI 인용 용이성</text></svg></div>`;
  },
  metricDuo(cite,views){
    return `<div class="metric-duo">
      <div class="metric ai"><span class="m-lbl"><span class="m-ic">🤖</span>AI 인용수</span><span class="m-val">${(cite||0).toLocaleString()}</span><span class="m-sub">generative citations</span></div>
      <div class="metric"><span class="m-lbl"><span class="m-ic">👁</span>사람 조회수</span><span class="m-val">${(views||0).toLocaleString()}</span><span class="m-sub">human pageviews</span></div>
    </div>`;
  },
  spark(arr){
    const mx=Math.max(...arr)||1;
    return `<div class="rc-spark">${arr.map(v=>`<i style="height:${Math.max(3,v/mx*24)}px"></i>`).join("")}</div>`;
  },
  review(rv){
    return `<div class="card rev"><div class="rev-top">${stars(rv.r)}<span class="rev-src">LCR 2026</span></div>
      <p>“${esc(rv.text)}”</p><div class="rev-by">— ${esc(rv.by)} · ${esc(rv.ago)}</div></div>`;
  },
  lawyerMini(id){const x=lw(id);
    return `<a href="#/lawyer/${id}" class="card mini"><div class="av av-md">${initials(x.name)}</div>
      <div class="mini-body"><h3>${esc(x.name)} <span class="dim" style="font-weight:400;font-size:13px">${esc(x.role)}</span></h3>
      <div class="mini-sub">${esc(fm(x.firm).name)}</div>
      <div class="mini-meta">${x.fields.slice(0,2).map(fieldTag).join("")}<span class="chip" style="font-family:var(--mono);font-size:11px">AI ${x.cite}</span></div>
      </div></a>`;
  },
  caseMini(id){const x=cs(id);
    return `<a href="#/case/${id}" class="card mini"><div class="av av-sm" style="background:linear-gradient(150deg,var(--c-blue),#1d4e85)">§</div>
      <div class="mini-body"><h3>${esc(x.title)}</h3>
      <div class="mini-sub mono">${esc(x.no)} · ${esc(x.court)}</div>
      <div class="mini-meta"><span class="tag tag-blue">${esc(x.type)}</span><span class="chip">${esc(x.status)}</span></div>
      </div></a>`;
  },
  newsMini(id){const x=nw(id);
    return `<a href="#/news/${id}" class="card mini"><div class="mini-body"><h3>${esc(x.title)}</h3>
      <div class="mini-sub mono">${esc(x.date)} · ${esc(x.section)}</div>
      <div class="mini-meta"><span class="chip" style="font-family:var(--mono);font-size:11px">AI 인용 ${x.cite}</span>
      ${x.lawyers.slice(0,1).map(l=>`<span class="chip-field chip">${esc(lw(l).name)}</span>`).join("")}</div>
      </div></a>`;
  },
  entLink(type,id){const d=describeEntity(type,id);
    const inner=`<div class="mb-t ent-${type}" style="color:var(--gold2)">${esc(d.t)}</div><div class="mb-n">${esc(d.n)}</div>${d.rows[0]?`<div class="mb-v">${esc(d.rows[0][1])}</div>`:""}`;
    return d.to?`<a href="${d.to}" class="mb-item">${inner}</a>`:`<div class="mb-item">${inner}</div>`;
  },
  metaBox(news){
    const ents=[];const seen=new Set();
    news.body.forEach(b=>{if(b.p){const m=b.p.matchAll(/§(\w+):(\w+)/g);for(const x of m){const k=x[1]+x[2];if(!seen.has(k)){seen.add(k);ents.push([x[1],x[2]])}}}});
    return `<div class="metabox"><div class="mb-head"><span style="font-size:18px">🧩</span><span class="serif">AI 인용 메타정보 박스</span></div>
      <div class="mb-sub">structured entities · AI가 이 기사를 인용할 때 그대로 가져가는 정규화 데이터</div>
      <div class="mb-grid">${ents.map(e=>C.entLink(e[0],e[1])).join("")}</div></div>`;
  }
};

const routes={"":PAGES.main,"list":PAGES.list,"lawyer":PAGES.lawyer,"firm":PAGES.firm,
  "case":PAGES.caseDetail,"news":PAGES.news,"admin-crawler":PAGES.adminCrawler,

function parseHash(){
  const raw=location.hash.replace(/^#\/?/,"");
  const [path,qs]=raw.split("?");
  const [name,id]=path.split("/");
  return{name:name||"",id,q:new URLSearchParams(qs||"")};
}
function setActiveNav(name,q){
  document.querySelectorAll("#mainnav a").forEach(a=>a.removeAttribute("aria-current"));
  const tab=q&&q.get("tab");
  let sel=name;
  if(name==="list")sel=tab==="cases"?"list-c":tab==="news"?"list-n":"list";
  const el=document.querySelector(`#mainnav a[data-r="${sel}"]`);
  if(el)el.setAttribute("aria-current","page");
}
function render(){
  clearTimers();
  const r=parseHash();
  const page=routes[r.name]||PAGES.notFound;
  const view=$("#view");
  view.innerHTML=page(r);
  view.classList.remove("fadeUp");void view.offsetWidth;view.style.animation="none";void view.offsetWidth;view.style.animation="";
  window.scrollTo(0,0);
  setActiveNav(r.name,r.q);
  runBehaviors(r);
}
window.addEventListener("hashchange",render);

/* ───────────── 페이지별 후처리 ───────────── */
function runBehaviors(r){
  // 게이지 애니메이션 — 아크 스윕과 동기화된 숫자 카운트업
  requestAnimationFrame(()=>{document.querySelectorAll("circle[data-goff]").forEach(c=>{c.style.strokeDashoffset=c.dataset.goff})});
  if(!matchMedia("(prefers-reduced-motion: reduce)").matches){
    document.querySelectorAll(".gauge text.g-num,.metric-duo .m-val").forEach(tx=>{
      const end=+tx.textContent.replace(/,/g,"");if(!end)return;const t0=performance.now();
      const fmt=tx.classList.contains("m-val")?(n=>n.toLocaleString()):(n=>String(n));
      const step=now=>{const p=Math.min((now-t0)/1100,1);
        tx.textContent=fmt(Math.round(end*(1-Math.pow(1-p,3))));
        if(p<1)requestAnimationFrame(step)};
      requestAnimationFrame(step);
    });
  }
  // 클릭 가능한 테이블 행
  document.querySelectorAll("tr.clk[data-href]").forEach(tr=>tr.addEventListener("click",()=>{location.hash=tr.dataset.href}));
  // 필터 칩 (시각 토글만)
  document.querySelectorAll(".fchip").forEach(c=>c.addEventListener("click",()=>{
    c.parentElement.querySelectorAll(".fchip").forEach(x=>x.classList.remove("on"));c.classList.add("on")}));
  if(r.name==="admin-crawler")animateCrawler();
  if(r.name==="admin-live")initLiveCrawler();
  if(r.name==="admin-citation")drawCharts();
  if(r.name===""||!r.name)wireHero();
}

/* ───────────── 히어로 검색 → 채팅 핸드오프 ───────────── */
function wireHero(){
  const form=$("#heroSearch");
  if(form)form.addEventListener("submit",e=>{e.preventDefault();
    const v=$("#heroInput").value.trim()||"주주총회 분쟁을 잘 다루는 변호사 추천해줘";askChat(v)});
  document.querySelectorAll(".h-suggest").forEach(b=>b.addEventListener("click",()=>askChat(b.dataset.ask)));
}

/* ───────────── 크롤러 애니메이션 (타이머 정리) ───────────── */
function animateCrawler(){
  const counters=document.querySelectorAll("[data-count]");
  const targets=[12290,8420,7650,4310,5230,36986];
  counters.forEach((el,i)=>{let n=0;const tgt=Math.floor(targets[i]/60);
    const t=setInterval(()=>{n+=Math.ceil(tgt*(0.6+Math.random()));if(n>=targets[i]){n=targets[i];clearInterval(t)}
      el.textContent=n.toLocaleString()},90);activeTimers.push(t)});
  // 누적 total 미세 증가(살아있는 느낌)
  const tot=$("[data-total]");if(tot){let base=36986;const t=setInterval(()=>{base+=Math.floor(Math.random()*3);tot.textContent=base.toLocaleString()},1400);activeTimers.push(t)}
}

function fmtBytes(n){return n<1024?n+" B":(n/1024).toFixed(1)+" KB"}
function initLiveCrawler(){
  const run=$("#lcRun"),exp=$("#lcExport");
  if(run)run.addEventListener("click",()=>{clearTimers();resetLiveCrawler();runLiveCrawler()});
  runLiveCrawler(); // 진입 시 1회 자동 재생
}
function resetLiveCrawler(){
  document.querySelectorAll(".lc-card").forEach(card=>{
    card.classList.remove("on","done");
    const b=card.querySelector("[data-status]");b.className="lc-badge lc-wait";b.textContent="대기";
    card.querySelector("[data-bar]").style.width="0";
    card.querySelector("[data-code]").textContent="—";
    card.querySelector("[data-bytes]").textContent="0 B";
    card.querySelector("[data-ms]").textContent="0 ms";
    const raw=card.querySelector("[data-raw]");raw.textContent="";raw.classList.remove("fade-out");
    const f=card.querySelector("[data-fields]");f.innerHTML="";f.classList.remove("fade-in");
  });
  const log=$("#lcLog");if(log)log.innerHTML="";
  const out=$("#lcExportOut");if(out){out.hidden=true;out.innerHTML=""}
  const exp=$("#lcExport");if(exp)exp.disabled=true;
}
function runLiveCrawler(){
  const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
  const log=$("#lcLog");const results=[];
  let clock=0; // 로그 타임스탬프 유사 진행(ms)
  function logLine(txt,ok){
    if(!log)return;
    clock+=Math.floor(120+Math.random()*280);
    const ts=("00"+Math.floor(clock/1000)).slice(-2)+"."+("000"+clock%1000).slice(-3);
    const el=document.createElement("div");
    el.className="lc-log-line"+(ok?" ok":"");
    el.innerHTML=`<span class="ts">[${ts}]</span> ${esc(txt)}`;
    log.appendChild(el);log.scrollTop=log.scrollHeight;
  }
  function setStatus(card,txt,cls,spin){
    const b=card.querySelector("[data-status]");
    b.className="lc-badge "+cls;
    b.innerHTML=(spin?'<span class="spinner"></span>':"")+esc(txt);
  }
  function rampBar(card,pct){card.querySelector("[data-bar]").style.width=pct+"%"}
  function countUp(el,end,suffix,ms){
    if(reduce){el.textContent=(suffix==="bytes"?fmtBytes(end):end+" ms");return}
    const t0=performance.now();
    const step=now=>{const p=Math.min((now-t0)/(ms||600),1);const v=Math.round(end*(1-Math.pow(1-p,3)));
      el.textContent=suffix==="bytes"?fmtBytes(v):v+" ms";
      if(p<1){const id=requestAnimationFrame(step)}};
    requestAnimationFrame(step);
  }
  function typeRaw(card,raw){
    const pre=card.querySelector("[data-raw]");
    if(reduce){pre.textContent=raw;return}
    let i=0;const chunk=Math.max(3,Math.round(raw.length/40));
    const t=setInterval(()=>{i+=chunk;pre.textContent=raw.slice(0,i);pre.scrollTop=pre.scrollHeight;
      if(i>=raw.length)clearInterval(t)},28);activeTimers.push(t);
  }
  function xformToFields(card,T){
    const raw=card.querySelector("[data-raw]"),f=card.querySelector("[data-fields]");
    f.innerHTML=T.fields.map(kv=>`<tr><td>${esc(kv[0])}</td><td>${esc(kv[1])}</td></tr>`).join("")
      +(T.go?`<tr class="golink" data-go="${T.go}"><td>→</td><td>플랫폼 레코드로 이동</td></tr>`:"");
    raw.classList.add("fade-out");f.classList.add("fade-in");
    f.querySelectorAll("tr.golink").forEach(tr=>tr.addEventListener("click",()=>{location.hash=tr.dataset.go}));
  }
  function runCard(idx,cb){
    const card=document.querySelector(`.lc-card[data-lc="${idx}"]`);
    const T=LC_TARGETS[idx];card.classList.add("on");
    const seq=[
      [0,()=>{setStatus(card,"접속중","lc-conn",true);logLine(`GET ${T.url}`)}],
      [420,()=>{setStatus(card,"수신","lc-recv",true);card.querySelector("[data-code]").textContent="200 OK";
        countUp(card.querySelector("[data-bytes]"),T.bytes,"bytes",700);
        countUp(card.querySelector("[data-ms]"),140+Math.floor(Math.random()*90),"ms",700);
        rampBar(card,45);logLine(`200 OK · ${fmtBytes(T.bytes)} 수신`,true)}],
      [980,()=>{setStatus(card,"파싱","lc-parse",true);typeRaw(card,T.raw);rampBar(card,70);
        logLine(`DOM 파싱 · 노드 ${Math.round(T.raw.length/9)}개 스캔`)}],
      [1620,()=>{setStatus(card,"필드 추출","lc-parse",true);rampBar(card,88);
        logLine(`셀렉터 매칭 · 필드 ${T.fields.length}개 추출`)}],
      [2050,()=>{setStatus(card,"정규화","lc-norm",true);xformToFields(card,T);rampBar(card,100);
        logLine(`정규화 · 스키마 매핑 → ${T.record.type} 레코드`)}],
      [2500,()=>{setStatus(card,"완료","lc-done",false);card.classList.remove("on");card.classList.add("done");
        results.push(T.record);logLine(`✓ 저장 · ${T.record.name||T.record.caseNo}`,true)}]
    ];
    seq.forEach(([d,fn])=>{const t=setTimeout(fn,reduce?0:d);activeTimers.push(t)});
    const done=setTimeout(cb,reduce?0:2560);activeTimers.push(done);
  }
  const GAP=reduce?0:900;
  [0,1,2].forEach(i=>{const t=setTimeout(()=>runCard(i,i===2?finish:()=>{}),i*GAP);activeTimers.push(t)});
  function finish(){
    const t=setTimeout(()=>{
      const exp=$("#lcExport");if(exp){exp.disabled=false;exp.onclick=()=>exportRecords(results)}
      logLine(`ingest 완료 · 레코드 ${results.length}건 정규화·저장`,true);
      toast("수집 완료 · 3건 정규화");
    },reduce?0:2600);activeTimers.push(t);
  }
}
function toCSV(records){
  const keys=[...new Set(records.flatMap(r=>Object.keys(r)))];
  const cell=v=>{const s=typeof v==="object"?JSON.stringify(v):String(v);
    return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s};
  return keys.join(",")+"\n"+records.map(r=>keys.map(k=>cell(r[k]??"")).join(",")).join("\n");
}
function triggerDownload(name,text,mime){
  const blob=new Blob([text],{type:mime});const url=URL.createObjectURL(blob);
  const a=document.createElement("a");a.href=url;a.download=name;
  document.body.appendChild(a);a.click();a.remove();
  const t=setTimeout(()=>URL.revokeObjectURL(url),1500);activeTimers.push(t);
}
function exportRecords(records){
  const json=JSON.stringify(records,null,2);const csv=toCSV(records);
  let ok=false;
  try{triggerDownload("live_crawl_export.json",json,"application/json");
    triggerDownload("live_crawl_export.csv",csv,"text/csv");ok=true}catch(e){ok=false}
  const out=$("#lcExportOut");
  if(ok){toast("Export 완료 · JSON·CSV 다운로드");
    if(out){out.hidden=false;out.innerHTML=`<div class="lc-export-head">✓ live_crawl_export.json · live_crawl_export.csv 다운로드됨</div><pre>${esc(json)}</pre>`}
  }else{
    if(out){out.hidden=false;out.innerHTML=`<div class="lc-export-head">Export 결과 (다운로드가 제한된 환경 — 아래 표시)</div><pre>${esc(json)}</pre>`}
    toast("Export 완료 · 화면에 표시");
  }
}

function drawCharts(){
  const ct=DB.citation;
  // 라인차트
  const lc=$("#lineChart");
  if(lc){const W=440,H=180,pad=28,mx=Math.max(...ct.trend);
    const pts=ct.trend.map((v,i)=>[pad+i*((W-pad*2)/(ct.trend.length-1)),H-pad-(v/mx)*(H-pad*2)]);
    const path=pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ");
    const area=path+` L${pts[pts.length-1][0].toFixed(1)} ${H-pad} L${pad} ${H-pad} Z`;
    const grid=[0,.25,.5,.75,1].map(g=>`<line class="grid-l" x1="${pad}" y1="${(pad+g*(H-pad*2)).toFixed(1)}" x2="${W-pad}" y2="${(pad+g*(H-pad*2)).toFixed(1)}"/>`).join("");
    lc.innerHTML=`<svg class="chart-svg" viewBox="0 0 ${W} ${H}"><defs><linearGradient id="areaGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--amber)" stop-opacity=".28"/><stop offset="1" stop-color="var(--amber)" stop-opacity="0"/></linearGradient></defs>
      ${grid}<path class="area" d="${area}"/><path class="line-p" d="${path}" pathLength="1" style="stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.3s ease forwards"/>
      <circle class="dot-end" cx="${pts[pts.length-1][0].toFixed(1)}" cy="${pts[pts.length-1][1].toFixed(1)}" r="4.5"/>
      ${ct.months.map((m,i)=>i%2===0?`<text x="${pts[i][0].toFixed(1)}" y="${H-8}" text-anchor="middle">${m}월</text>`:"").join("")}
    </svg><style>@keyframes draw{to{stroke-dashoffset:0}}</style>`;
  }
  // 바차트
  const bc=$("#barChart");
  if(bc){const W=280,H=180,pad=30,mx=Math.max(...ct.byModel.map(b=>b.n)),bw=42,gap=(W-pad*2-bw*ct.byModel.length)/(ct.byModel.length-1);
    // 리더=풀 앰버, 팔로워=감쇠 — 순위를 색으로도 인코딩
    bc.innerHTML=`<svg class="chart-svg" viewBox="0 0 ${W} ${H}"><defs><linearGradient id="barGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--amber2)"/><stop offset="1" stop-color="var(--amber)"/></linearGradient></defs>${ct.byModel.map((b,i)=>{
      const x=pad+i*(bw+gap),h=(b.n/mx)*(H-pad*2),y=H-pad-h;
      return `<rect class="bar" x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw}" height="${h.toFixed(1)}" rx="4" style="animation-delay:${i*0.12}s;opacity:${i===0?1:.55}"/>
        <text x="${(x+bw/2).toFixed(1)}" y="${y-7}" text-anchor="middle" style="fill:var(--t1);font-weight:800">${b.n}</text>
        <text x="${(x+bw/2).toFixed(1)}" y="${H-10}" text-anchor="middle">${esc(b.m)}</text>`}).join("")}</svg>`;
  }
}
